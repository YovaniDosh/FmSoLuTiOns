<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog Preview Card creado como desafío de Frontend Mentor.">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/ajustes.png">
  <link rel="stylesheet" href="css/styles.css">
  <title>Blog preview card</title>
</head>
<body>

  <main class="page">
    
    <article class="blog-card">

      <img class="blog-card__image" src="../../assets/images/illustration-article.svg" alt="Ilustracion abstracta del articulo">
      <div class="blog-car__content">
        <span class="blog-card__category">
          Learning
        </span>

        <p class="blog-card__date">
          Published 21 Dec 2023
        </p>

        <h1 class="blog-card__title">
          HTML &amp; CSS foundations
        </h1>

        <p class="blog-card__description">
          These languages are the backbone of every website, 
          defining structure, content, and presentation.
        </p>

        <div class="blog-card__author">
          <img class="blog-card__avatar" src="../../assets/images/image-avatar.webp" alt="Avatar de Greg Hooper">
          <span class="blog-card__author-name">
            Greg Hooper
          </span>

        </div>

      </div>

    </article>
  
  </main>

</body>
</html>
