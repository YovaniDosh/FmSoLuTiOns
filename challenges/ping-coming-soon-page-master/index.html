<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Subscribe to be notified when Ping launches.">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <title>Frontend Mentor | Ping coming soon page</title>

      <img class="logo" src="../../assets/images/logoPing.svg" alt="Ping">
      <h1>We are launching <strong>soon!</strong></h1>
      <p class="subtitle">Subscribe and get notified</p>
      <form class="subscribe-form" novalidate>
        <div class="field">
          <label class="sr-only" for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="Your email address..." autocomplete="email" aria-describedby="email-error" required>
          <p class="error-message" id="email-error" aria-live="polite"></p>
        </div>
        <button type="submit">Notify Me</button>
      </form>
    </header>
    <img class="dashboard" src="../../assets/images/illustration-dashboard.png" alt="Ping analytics dashboard preview">
