<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive Qr code component built or a Frontend Mentor challenge."> 
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/ajustes.png">
  <link rel="stylesheet" href="css/style.css">

  <title>QR code component</title>

</head>
<body>
  
  <main class="page">
    
    <article class="qr-card">
      
      <img class="qr-card__image" src="../../assets/images/image-qr-code.png" alt="QR code to visit the Frontend Mentor website" width="288" height="289">
      
      <div class="qr-car__content">
        <h1 class="qr-card__title">Improve you front-end skills by building projects</h1>
        <p class="qr-card__description">Scan the QR code to visit Frontend Mentor and take tour coding skills to the next level</p>
      
      </div>
    
    </article>
  
  </main>
</body>
</html>
