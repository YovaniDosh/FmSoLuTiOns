<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Profile Card Component solution for Frontend Mentor.">
  
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/ajustes.png">
  <link rel="stylesheet" href="css/style.css">
  
  <title>Profile Card Component</title>

</head>
<body>
  <main class="page">
    <article class="profile-card">
      <img class="profile-card__cover" src="../../assets/images/varying-stripes.svg" alt="" aria-hidden="true">
      
      <div class="profile-card__content">
        <a href="https://www.linkedin.com/in/johanxt/"><img class="profile-card__avatar" src="../../assets/images/188736133.png" alt="Portrait of Giovanni JohanXT"></a>
        
        <div class="profile-card__identity">
          <div class="profile-card__name-row">
            <h1>
              Giovanni JohanXT 
            </h1>
            <span>
              26
            </span>
          </div>
          <p>
            Hong Kong
          </p>
        </div>

      </div>

      <footer class="profile-card__stats">

        <div>
          <strong>
            80K
          </strong>

          <span>
            Followers
          </span>
        </div>

        <div>
          <strong>
            803K
          </strong>

          <span>
            Likes
          </span>
        </div>

        <div>
          <strong>
            1.4K
          </strong>

          <span>
            Photos
          </span>
        </div>

      </footer>

    </article>

  </main>
</body>
</html>
