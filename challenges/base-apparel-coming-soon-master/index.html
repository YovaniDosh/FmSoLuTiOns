<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Subscribe to receive Base Apparel launch announcements and deals.">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/ajustes.png">
  <link rel="stylesheet" href="./css/style.css">
  <title>Base Apparel coming soon page</title>
</head>
<body>
  <main class="coming-soon">
    <header class="coming-soon__header">
      <img class="coming-soon__logo" src="../../assets/images/logoBaseApparel.svg" alt="Base Apparel">
    </header>
    <picture class="coming-soon__picture">
      <source media="(min-width: 64rem)" srcset="../../assets/images/hero-base-apparel-desktop.jpg">
      <img class="coming-soon__hero" src="../../assets/images/hero-base-apparel-mobile.jpg" alt="Woman wearing a coral shirt">
    </picture>
    <section class="coming-soon__content" aria-labelledby="pageTitle">
      <h1 class="coming-soon__title" id="pageTitle"><span>We're</span> coming soon</h1>
      <p class="coming-soon__description">Hello fellow shoppers! We're currently building our new fashion store. Add your email below to stay up-to-date with announcements and our launch deals.</p>
      <form class="subscription-form" novalidate>
        <div class="subscription-form__control">
          <label class="sr-only" for="email">Email address</label>
          <input class="subscription-form__input" id="email" name="email" type="email" placeholder="Email Address" autocomplete="email" aria-describedby="emailError" required>
          <img class="subscription-form__error-icon" src="../../assets/images/icon-error-base-apparel.svg" alt="" aria-hidden="true">
          <button class="subscription-form__button" type="submit" aria-label="Submit email address">
            <img src="../../assets/images/icon-arrow-base-apparel.svg" alt="" aria-hidden="true">
          </button>
        </div>
        <p class="subscription-form__error" id="emailError" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
