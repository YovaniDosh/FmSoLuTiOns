<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Start a free trial and learn to code by watching experienced developers.">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/style.css">
  <title>Intro component with sign up form</title>
</head>
<body>
  <main class="signup-page">
    <section class="signup-page__intro" aria-labelledby="pageTitle">
      <h1 class="signup-page__title" id="pageTitle">Learn to code by watching others</h1>
      <p class="signup-page__description">See how experienced developers solve problems in real-time. Watching scripted tutorials is great, but understanding how developers think is invaluable.</p>
    </section>

    <section class="signup-page__offer" aria-label="Free trial sign up">
      <p class="signup-page__trial"><strong>Try it free 7 days</strong> then $20/mo. thereafter</p>
      <form class="signup-form" novalidate>
        <div class="signup-form__field">
          <label class="sr-only" for="firstName">First Name</label>
          <input class="signup-form__input" id="firstName" name="firstName" type="text" placeholder="First Name" autocomplete="given-name" aria-describedby="firstNameError" required>
          <img class="signup-form__error-icon" src="../../assets/images/icon-error-intro.svg" alt="" aria-hidden="true">
          <p class="signup-form__error" id="firstNameError" aria-live="polite"></p>
        </div>
        <div class="signup-form__field">
          <label class="sr-only" for="lastName">Last Name</label>
          <input class="signup-form__input" id="lastName" name="lastName" type="text" placeholder="Last Name" autocomplete="family-name" aria-describedby="lastNameError" required>
          <img class="signup-form__error-icon" src="../../assets/images/icon-error-intro.svg" alt="" aria-hidden="true">
          <p class="signup-form__error" id="lastNameError" aria-live="polite"></p>
        </div>
        <div class="signup-form__field">
          <label class="sr-only" for="email">Email Address</label>
          <input class="signup-form__input" id="email" name="email" type="email" placeholder="Email Address" autocomplete="email" aria-describedby="emailError" required>
          <img class="signup-form__error-icon" src="../../assets/images/icon-error-intro.svg" alt="" aria-hidden="true">
          <p class="signup-form__error" id="emailError" aria-live="polite"></p>
        </div>
        <div class="signup-form__field">
          <label class="sr-only" for="password">Password</label>
          <input class="signup-form__input" id="password" name="password" type="password" placeholder="Password" autocomplete="new-password" aria-describedby="passwordError" required>
          <img class="signup-form__error-icon" src="../../assets/images/icon-error-intro.svg" alt="" aria-hidden="true">
          <p class="signup-form__error" id="passwordError" aria-live="polite"></p>
        </div>
        <button class="signup-form__button" type="submit">Claim your free trial</button>
        <p class="signup-form__terms">By clicking the button, you are agreeing to our <a href="#">Terms and Services</a></p>
      </form>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
