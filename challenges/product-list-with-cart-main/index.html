<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Build a dessert order and review it in an accessible shopping cart.">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/ajustes.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Product list with cart</title>
</head>
<body>
  <main class="shop">
    <section class="catalog" aria-labelledby="catalog-title">
      <h1 id="catalog-title">Desserts</h1>
      <div class="product-grid" id="productGrid"></div>
    </section>

    <aside class="cart" aria-labelledby="cart-title">
      <h2 id="cart-title">Your Cart (<span id="cartCount">0</span>)</h2>
      <div id="cartContent" aria-live="polite"></div>
    </aside>
  </main>

  <dialog class="confirmation" id="confirmationDialog" aria-labelledby="confirmation-title">
    <img src="../../assets/images/icon-order-confirmed.svg" alt="" width="48" height="48">
    <h2 id="confirmation-title">Order Confirmed</h2>
    <p>We hope you enjoy your food!</p>
    <div class="confirmation__summary" id="confirmationSummary"></div>
    <button class="primary-button" id="newOrderButton" type="button">Start New Order</button>
  </dialog>

  <script src="js/script.js"></script>
</body>
</html>
