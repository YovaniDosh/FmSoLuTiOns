<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stats Preview Card Component solution for Frontend Mentor.">

  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/ajustes.png">
  <link rel="stylesheet" href="css/style.css">

  <title>Stats Preview Card Component</title>
</head>

<body>
  <main class="page">
    <article class="stats-card">
      <div class="stats-card__image" aria-hidden="true"></div>

      <div class="stats-card__content">
        <h1>Get <span>insights</span> that help your business grow.</h1>

        <p class="stats-card__description">
          Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.
        </p>

        <div class="stats-card__stats">
          <div>
            <strong>10k+</strong>
            <span>Companies</span>
          </div>

          <div>
            <strong>314</strong>
            <span>Templates</span>
          </div>

          <div>
            <strong>12M+</strong>
            <span>Queries</span>
          </div>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
