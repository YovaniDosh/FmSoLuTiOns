<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <meta name="description" content="Order Summary Component created as a Frontend Mentor challenge.">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/ajustes.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Order summary card</title>
</head>
<body>

  <main class="page">

    <article class="order-card">

      <img src="../../assets/images/illustration-hero.svg" alt="" aria-hidden="true">
      <div class="order-card__content">

        <h1 class="order-card__title">Order Sumary</h1>
        <p class="order-card__description">
          You can now listen to millions of songs, audiobooks,
          and podcasts on any device anywhere you like!
        </p>
        
        <div class="order-card__plan">
          <img class="order-card__plan-icon" src="../../assets/images/icon-music.svg" alt="">
          <div class="order-card__plan-name">
            <strong class="order-card__plan-name">
              Annual Plan
            </strong>
            <span class="order-card__plan-price">
              %59.99/year
            </span>
          </div>
          <a href="#" class="order-card__change-link">Change</a>
        </div>
        
        <button class="button button--primary" type="button">
          Proceed to Payment
        </button>
        
        <button class="button button--secondary" type="button">
          Cancel Order
        </button>
      
      </div>
    </article>
  </main>
</body>
</html>
