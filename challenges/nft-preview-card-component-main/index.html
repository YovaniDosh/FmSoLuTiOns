<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NFT Preview Card Component solution for Frontend Mentor.">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/ajustes.png">
  <link rel="stylesheet" href="css/style.css">
  <title>NFT preview card component</title>
</head>
<body>
  <main class="page">
    <article class="nft-card">

      <a class="nft-card__image-link" href="#" aria-label="View Equilibrium NFT">
        <img class="nft-card__image" src="../../assets/images/image-equilibrium.jpg" alt="Equilibrium NFT represented by a colorful translucent cube">

        <span class="nft-card__overlay" aria-hidden="true">
          <img class="nft-card__view-icon" src="../../assets/images/icon-view.svg" alt="">
        </span>

      </a>

      <div class="nft-card__content">

        <h1 class="nft-card__title">
          <a href="#">
            Equilibrium #3429
          </a>
        </h1>

        <p class="nft-card__description">
          Our Equilibrium collection promotes
          balance and calm.
        </p>

        <div class="nft-card__information">

          <p class="nft-card__price">
            <img src="../../assets/images/icon-ethereum.svg" alt="" aria-hidden="true">

            <strong>0.041 ETH</strong>
          </p>

          <p class="nft-card__time">
            <img src="../../assets/images/icon-clock.svg" alt="" aria-hidden="true">

            <span>3 days left</span>
          </p>

        </div>

        <footer class="nft-card__creator">

          <img class="nft-card__avatar" src="../../assets/images/image-avatar.png" alt="Portrait of Jules Wyvern">

          <p>Creation of<a href="#"> Jules Wyvern</a></p>

        </footer>
      </div>
    </article>

  </main>
</body>
</html>
